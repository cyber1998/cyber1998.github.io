<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat with my AI · Cyber Naskar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Chat with Cyber Naskar's AI assistant. Ask anything about his experience as a backend engineer and software consultant, his skills, and how he can help your team." />
  <meta name="robots" content="index,follow" />
  <meta name="author" content="Cyber Naskar" />
  <link rel="canonical" href="https://cybernaskar.com/chat.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Chat with my AI · Cyber Naskar" />
  <meta property="og:description" content="Ask Cyber Naskar's AI assistant anything about his experience, skills, and how he can help your team." />
  <meta property="og:url" content="https://cybernaskar.com/chat.html" />
  <meta property="og:image" content="https://cybernaskar.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chat with my AI · Cyber Naskar" />
  <meta name="twitter:description" content="Ask Cyber Naskar's AI assistant anything about his experience and skills." />
  <meta name="twitter:image" content="https://cybernaskar.com/og-image.png" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <main>
    <header>
      <div class="logo">Cyber Naskar</div>
      <nav>
        <a href="index.html">About</a>
        <a href="experience.html">Experience</a>
        <a href="chat.html" class="active">Chat <span class="nav-badge">AI</span></a>
      </nav>
    </header>

    <section id="chat" class="chat-section chat-page">
      <h1 class="section-heading">Chat with my AI</h1>
      <p class="section-subtitle">Ask anything about my experience, expertise, and how I can help your team.</p>
      <div class="chat-container" aria-label="AI chat">
        <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
        <div class="chat-prompts" id="chat-prompts">
          <button type="button" class="chat-expand" id="chat-expand" aria-label="Expand chat" aria-pressed="false" title="Expand chat">
            <svg id="chat-expand-icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
            <svg id="chat-expand-icon-collapse" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
              <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
              <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
              <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
            </svg>
          </button>
        </div>
        <form class="chat-input-area" id="chat-form">
          <textarea id="chat-input" class="chat-input" rows="1" placeholder="Type a message…" aria-label="Type a message"></textarea>
          <button type="submit" class="chat-send">Send</button>
        </form>
      </div>
    </section>

    <footer>
      <div>© <span id="year"></span> Cyber Naskar</div>
      <div class="footer-links">
        <a href="mailto:cybr1998@gmail.com">Email</a>
        <a href="https://www.linkedin.com/in/cyber-naskar" target="_blank" rel="noreferrer">LinkedIn</a>
        <a href="https://github.com/cyber1998" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      const CHAT_API = 'https://api.cybernaskar.com/api/chat';
      const messagesEl = document.getElementById('chat-messages');
      const formEl = document.getElementById('chat-form');
      const inputEl = document.getElementById('chat-input');
      const sendBtn = formEl.querySelector('.chat-send');

      const history = [];
      let busy = false;
      let abortController = null;

      function addMessage(role, content) {
        history.push({ role: role, content: content });
      }

      function createBubble(role) {
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble ' + role;
        messagesEl.appendChild(bubble);
        return bubble;
      }

      function scrollToBottom(force) {
        if (!force) {
          const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 140;
          if (!nearBottom) return;
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderToBubble(bubble, text) {
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
          bubble.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
        } else {
          bubble.style.whiteSpace = 'pre-wrap';
          bubble.textContent = text;
        }
      }

      function setBusy(next) {
        busy = next;
        inputEl.disabled = next;
        sendBtn.disabled = next;
      }

      async function sendMessage(text) {
        if (typeof text !== 'string') {
          text = inputEl.value;
        }
        text = text.trim();
        if (!text || busy) return;

        inputEl.value = '';
        inputEl.style.height = 'auto';
        createBubble('user').textContent = text;
        addMessage('user', text);
        scrollToBottom(true);

        setBusy(true);
        const aiBubble = createBubble('ai');
        const typing = document.createElement('span');
        typing.className = 'chat-typing';
        typing.innerHTML = '<span></span><span></span><span></span>';
        aiBubble.appendChild(typing);
        scrollToBottom(true);

        abortController = new AbortController();
        let fullText = '';
        let errored = false;
        let renderFrame = null;

        const scheduleRender = () => {
          if (renderFrame) return;
          renderFrame = requestAnimationFrame(() => {
            renderFrame = null;
            renderToBubble(aiBubble, fullText);
            scrollToBottom();
          });
        };

        try {
          const response = await fetch(CHAT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history.slice() }),
            signal: abortController.signal
          });

          if (!response.ok || !response.body) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.error || 'Request failed');
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          const consume = (part) => {
            for (const line of part.split('\n')) {
              if (!line.startsWith('data:')) continue;
              const data = line.slice(5).trim();
              if (!data || data === '[DONE]') continue;
              try {
                const json = JSON.parse(data);
                const delta = json.choices && json.choices[0] &&
                  json.choices[0].delta && json.choices[0].delta.content;
                if (!delta) continue;
                if (typing.parentNode) typing.remove();
                fullText += delta;
                scheduleRender();
              } catch (e) {
                // ignore malformed chunks
              }
            }
          };

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const parts = buffer.split('\n\n');
            buffer = parts.pop() || '';

            for (const part of parts) {
              consume(part);
            }
          }

          if (buffer) {
            consume(buffer);
          }

          if (!fullText && typing.parentNode) {
            throw new Error('Empty response');
          }
        } catch (err) {
          if (renderFrame) {
            cancelAnimationFrame(renderFrame);
            renderFrame = null;
          }
          if (err.name === 'AbortError') {
            setBusy(false);
            if (typing.parentNode) typing.remove();
            return;
          }
          errored = true;
        }

        setBusy(false);
        if (typing.parentNode) typing.remove();

        if (renderFrame) {
          cancelAnimationFrame(renderFrame);
          renderFrame = null;
        }

        if (errored || !fullText) {
          aiBubble.textContent = '';
          aiBubble.classList.add('chat-error');
          aiBubble.textContent = "Sorry, I couldn't reach the assistant. Please try again.";
        } else {
          renderToBubble(aiBubble, fullText);
          scrollToBottom(true);
          addMessage('assistant', fullText);
        }

        inputEl.focus();
      }

      const welcome = createBubble('ai');
      welcome.textContent = 'Hi, I\'m Cyber\'s AI assistant. Ask me anything about his experience, skills, or how he can help your team.';
      if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
        welcome.innerHTML = DOMPurify.sanitize(marked.parse(welcome.textContent, { breaks: true }));
      }
      addMessage('assistant', welcome.textContent);

      const PROMPTS = [
        "What does Cyber work on currently?",
        "What are Cyber's skills?",
        "Breakdown Cyber's experience in years and months",
        "What kind of AI skills does Cyber know?",
        "What's Cyber's core tech stack?",
        "Has Cyber shipped LLM features in production?",
        "Can Cyber help optimize slow databases?",
        "What does a consulting engagement look like?",
        "Is Cyber available for new projects?",
        "How does Cyber approach API design?",
        "What GenAI experience does Cyber have?",
        "Which cloud platforms does Cyber use?",
        "What's Cyber's experience with GraphQL?",
        "Has Cyber worked with startups?",
        "How deep is Cyber's Django experience?",
        "Can Cyber help design AI features for our product?",
        "What kinds of clients does Cyber work with?",
        "Does Cyber prefer remote or on-site work?",
        "How fast can Cyber start a project?",
        "Where is Cyber based?",
        "How does Cyber handle scalability challenges?",
        "What's Cyber's experience with agents and agentic workflows?"
      ];

      const promptsEl = document.getElementById('chat-prompts');
      const expandBtn = document.getElementById('chat-expand');
      const chatSection = document.getElementById('chat');

      const pool = PROMPTS.slice();
      for (let i = 0; i < 5 && pool.length; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chat-prompt';
        btn.textContent = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        btn.addEventListener('click', () => sendMessage(btn.textContent));
        promptsEl.insertBefore(btn, expandBtn);
      }

      expandBtn.addEventListener('click', () => {
        const expanded = chatSection.classList.toggle('chat-expanded');
        expandBtn.setAttribute('aria-pressed', String(expanded));
        expandBtn.setAttribute('aria-label', expanded ? 'Collapse chat' : 'Expand chat');
        expandBtn.title = expanded ? 'Collapse chat' : 'Expand chat';
        document.getElementById('chat-expand-icon-expand').hidden = expanded;
        document.getElementById('chat-expand-icon-collapse').hidden = !expanded;
        inputEl.focus();
      });

      formEl.addEventListener('submit', (e) => {
        e.preventDefault();
        sendMessage();
      });

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
      });

      if (window.matchMedia('(min-width: 768px)').matches) {
        inputEl.focus();
      }
    })();
  </script>
</body>
</html>
